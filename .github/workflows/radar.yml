name: Industry Capital Radar

on:
  push:
    paths-ignore:
      - 'public/**'

  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: manual
        type: choice
        options:
          - manual
          - daily
          - weekly
          - monthly

  schedule:
    - cron: '17 21 * * 1-5'
    - cron: '37 22 * * 0'
    - cron: '47 23 1 * *'

permissions:
  contents: write

concurrency:
  group: industry-capital-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 21 * * 1-5" ]; then
            echo "value=daily" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "37 22 * * 0" ]; then
            echo "value=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "value=monthly" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build JSON
        run: python -m src.main --mode "${{ steps.mode.outputs.value }}"

      - name: Commit outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/*.json

          if git diff --cached --quiet; then
            echo "No output change"
          else
            git commit -m "chore: refresh radar outputs"
            git push
          fi
